[package]
name = "sysjam"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A jam band of machine musicians playing your Linux system"
license = "GPL-3.0-or-later"
repository = "https://github.com/trawn3333/sysjam"
readme = "README.md"

[dependencies]
libc = "0.2"
x11rb = { version = "0.13", default-features = false }
rustysynth = "=1.3.5"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", default-features = false, features = ["events"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
